<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img"
     aria-label="Photo placeholder">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e1da"/>
      <stop offset="1" stop-color="#d3ccc1"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>

  <!-- window light -->
  <g opacity="0.55">
    <rect x="180" y="120" width="420" height="620" rx="8" fill="#f6f1e7"/>
    <rect x="180" y="120" width="420" height="620" rx="8" fill="none"
          stroke="#a89b87" stroke-width="6"/>
    <path d="M390 120 v620 M180 430 h420" stroke="#a89b87" stroke-width="6"/>
  </g>

  <!-- light spill on the floor -->
  <path d="M600 740 L1180 740 L1420 1000 L360 1000 Z" fill="#f2ead9" opacity="0.6"/>

  <!-- two shapes, apart -->
  <circle cx="980" cy="470" r="86" fill="#b98a78" opacity="0.75"/>
  <circle cx="1230" cy="560" r="52" fill="#9c8f7c" opacity="0.7"/>

  <g fill="none" stroke="#8d8375" stroke-width="3" opacity="0.45">
    <path d="M40 40 h120 M40 40 v120 M1560 960 h-120 M1560 960 v-120"/>
  </g>

  <text x="800" y="965" text-anchor="middle" fill="#7c7365" opacity="0.7"
        font-family="ui-monospace, monospace" font-size="26" letter-spacing="6">
    PHOTO PLACEHOLDER
  </text>
</svg>
